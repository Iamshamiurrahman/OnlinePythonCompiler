name: Build HabitBreaker APK

on:
  push:
    branches:
      - chatgpt-habit-breaker-build
    paths:
      - 'HabitBreaker/**'
      - '.github/workflows/habit-breaker-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'HabitBreaker/**'
      - '.github/workflows/habit-breaker-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: HabitBreaker
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitBreaker-APK
          path: HabitBreaker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
